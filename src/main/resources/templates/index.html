<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Rental System</title>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #00bcd4;
        }

        table {
            border-collapse: collapse;
            width: 50%;
            margin-top: 20px;
            background-color: #1e1e1e;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #333;
        }
    </style>
</head>
<body>

<h1>Movie Rental System</h1>

<table>
    <thead>
    <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>

    <tr>
        <td>Leo</td>
        <td>Available</td>
        <td><button>Rent</button></td>
    </tr>
    <tr>
        <td>Jailer</td>
        <td>Rented</td>
        <td><button>Return</button></td>
    </tr>
    </tbody>
</table>

</body>
</html>
