<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviePlatform — Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:           #06050d;
            --surface:      #0c0a18;
            --card:         #0f0d1c;
            --card2:        #131128;
            --glass:        rgba(255,255,255,0.035);
            --glass-border: rgba(255,255,255,0.07);
            --glass-h:      rgba(255,255,255,0.06);
            --purple1:      #9d7ff5;
            --purple2:      #6d28d9;
            --purple-glow:  rgba(109,40,217,0.28);
            --purple-soft:  rgba(157,127,245,0.07);
            --text:         #ede8ff;
            --text-sub:     #8a82aa;
            --text-dim:     #3d3660;
            --border:       rgba(157,127,245,0.1);
            --border-h:     rgba(157,127,245,0.22);
            --danger:       #f87171;
            --success:      #4ade80;
            --warn:         #fbbf24;
            --imdb:         #f5c518;
            --tomato:       #fa320a;
        }

        html, body { height: 100%; scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── AURORA ── */
        .aurora {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            overflow: hidden;
        }
        .aurora-blob {
            position: absolute; border-radius: 50%;
            filter: blur(110px); opacity: 0.09;
            animation: drift 14s ease-in-out infinite alternate;
        }
        .ab1 { width: 700px; height: 700px; background: #4c1d95; top: -200px; left: -200px; animation-delay: 0s; }
        .ab2 { width: 500px; height: 500px; background: #1e1b4b; bottom: -100px; right: -100px; animation-delay: -5s; }
        .ab3 { width: 350px; height: 350px; background: #7c3aed; top: 40%; left: 55%; animation-delay: -10s; }
        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(25px,15px) scale(1.06); }
        }

        /* ── GRID ── */
        .grid-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image:
                    linear-gradient(rgba(157,127,245,0.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(157,127,245,0.025) 1px, transparent 1px);
            background-size: 56px 56px;
        }

        /* ── NAVBAR ── */
        .navbar {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
            z-index: 1000; height: 60px; width: 92%; max-width: 1100px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; border-radius: 100px;
            background: rgba(6,5,13,0.55);
            backdrop-filter: blur(28px) saturate(150%);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            box-shadow:
                    rgba(255,255,255,0.07) 0 0 0 0.5px inset,
                    rgba(0,0,0,0.35) 0 10px 40px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.35rem; letter-spacing: 2px;
            color: var(--text); text-decoration: none; flex-shrink: 0;
        }
        .nav-logo span { color: var(--purple1); }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        .nav-links a {
            color: var(--text-sub); text-decoration: none;
            font-size: 0.83rem; padding: 7px 15px;
            border-radius: 50px; transition: 0.25s;
        }
        .nav-links a.active, .nav-links a:hover {
            color: var(--text); background: rgba(255,255,255,0.07);
        }
        .nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .btn-sm {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--text-sub);
            font-family: 'Outfit', sans-serif; font-weight: 500;
            font-size: 0.8rem; padding: 7px 14px;
            cursor: pointer; transition: all 0.22s;
            text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-sm:hover { border-color: var(--border-h); color: var(--text); background: var(--glass-h); }
        .profile-btn {
            width: 38px; height: 38px; min-width: 38px; border-radius: 50% !important;
            padding: 0 !important; display: inline-flex; align-items: center; justify-content: center;
        }

        /* ── MAIN LAYOUT ── */
        .page-wrap {
            position: relative; z-index: 1;
            max-width: 1200px; margin: 0 auto;
            padding: 100px 24px 80px;
        }

        /* ── BREADCRUMB ── */
        .breadcrumb {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.78rem; color: var(--text-dim);
            margin-bottom: 22px;
        }
        .breadcrumb a { color: var(--text-sub); text-decoration: none; transition: color 0.2s; }
        .breadcrumb a:hover { color: var(--purple1); }
        .breadcrumb .sep { color: var(--text-dim); }
        .breadcrumb .current { color: var(--text-sub); }

        /* ── PLAYER SECTION ── */
        .player-section {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            align-items: start;
        }

        /* ── PLAYER BOX ── */
        .player-box {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 0 1px rgba(157,127,245,0.06), 0 30px 70px rgba(0,0,0,0.6);
        }

        .player-iframe {
            width: 100%; height: 100%; border: none; display: block;
        }

        /* Placeholder state */
        .player-placeholder {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 20px; background: #06050d;
            cursor: pointer;
            transition: background 0.3s;
        }
        .player-placeholder:hover { background: #0a0815; }
        .player-placeholder.hidden { display: none; }

        .play-ring {
            width: 80px; height: 80px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(109,40,217,0.18);
            border: 1.5px solid rgba(157,127,245,0.3);
            backdrop-filter: blur(8px);
            transition: all 0.3s;
            position: relative;
        }
        .player-placeholder:hover .play-ring {
            background: rgba(109,40,217,0.32);
            border-color: rgba(157,127,245,0.5);
            transform: scale(1.07);
        }
        .play-ring svg { width: 32px; height: 32px; fill: var(--purple1); margin-left: 4px; }

        .play-label {
            font-size: 0.85rem; color: var(--text-sub); letter-spacing: 1px;
        }

        .thumb-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            opacity: 0.18; filter: blur(2px);
        }

        /* ── EPISODE / SOURCE BAR ── */
        .source-bar {
            display: flex; align-items: center; gap: 8px;
            margin-top: 14px; flex-wrap: wrap;
        }
        .source-label {
            font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase;
            color: var(--text-dim); font-weight: 600; margin-right: 4px;
        }
        .source-btn {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--text-sub);
            font-family: 'Outfit', sans-serif; font-size: 0.78rem;
            padding: 6px 14px; cursor: pointer; transition: all 0.2s;
        }
        .source-btn.active, .source-btn:hover {
            background: rgba(109,40,217,0.22);
            border-color: rgba(157,127,245,0.3);
            color: var(--text);
        }

        /* ── INFO PANEL (right sidebar) ── */
        .info-panel {
            display: flex; flex-direction: column; gap: 14px;
        }

        /* Liquid glass card */
        .glass-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            box-shadow:
                    rgba(255,255,255,0.04) 0 1px 0 inset,
                    rgba(0,0,0,0.3) 0 20px 40px;
        }

        .movie-poster {
            width: 100%; aspect-ratio: 2/3;
            object-fit: cover; display: block;
            border-bottom: 1px solid var(--glass-border);
        }

        .movie-poster-placeholder {
            width: 100%; aspect-ratio: 2/3;
            background: linear-gradient(160deg, #1a1630, #0d0b1a);
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid var(--glass-border);
        }
        .movie-poster-placeholder svg { width: 40px; height: 40px; color: var(--text-dim); }

        .panel-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

        .panel-title {
            font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.3;
        }
        .panel-sub {
            font-size: 0.75rem; color: var(--text-sub); line-height: 1.5;
        }

        /* Ratings row */
        .ratings-row {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .rating-pill {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 10px; border-radius: 8px;
            font-size: 0.75rem; font-weight: 700;
            border: 1px solid var(--glass-border);
            background: var(--glass);
        }
        .imdb-pill { border-color: rgba(245,197,24,0.25); }
        .imdb-pill span { color: var(--imdb); }
        .imdb-pill .label { color: var(--text-dim); font-weight: 500; font-size: 0.65rem; }
        .tomato-pill { border-color: rgba(250,50,10,0.2); }
        .tomato-pill span { color: var(--tomato); }
        .tomato-pill .label { color: var(--text-dim); font-weight: 500; font-size: 0.65rem; }

        /* Meta list */
        .meta-list { display: flex; flex-direction: column; gap: 6px; }
        .meta-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            font-size: 0.75rem; gap: 8px;
        }
        .meta-key { color: var(--text-dim); font-weight: 600; letter-spacing: 0.5px; flex-shrink: 0; }
        .meta-val { color: var(--text-sub); text-align: right; }

        /* ── BELOW PLAYER: TITLE + ACTIONS ── */
        .below-player { margin-top: 20px; }

        .movie-main-title {
            font-size: 1.6rem; font-weight: 700; color: var(--text);
            line-height: 1.2; margin-bottom: 6px;
        }
        .movie-short-desc {
            font-size: 0.88rem; color: var(--text-sub); line-height: 1.6;
            max-width: 700px; margin-bottom: 20px;
        }

        /* ── ACTION ROW ── */
        .action-row {
            display: flex; align-items: center; gap: 12px;
            flex-wrap: wrap; margin-bottom: 28px;
        }

        /* Like / Dislike */
        .vote-group {
            display: flex; background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 10px; overflow: hidden;
        }
        .vote-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 9px 16px; background: none; border: none;
            color: var(--text-sub); font-family: 'Outfit', sans-serif;
            font-size: 0.83rem; cursor: pointer; transition: all 0.2s;
        }
        .vote-btn:hover { background: var(--glass-h); color: var(--text); }
        .vote-btn.like:hover svg { color: var(--success); }
        .vote-btn.dislike:hover svg { color: var(--danger); }
        .vote-btn svg { width: 16px; height: 16px; }
        .vote-divider { width: 1px; background: var(--glass-border); align-self: stretch; }

        /* Star rating */
        .star-group {
            display: flex; align-items: center; gap: 10px;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 10px; padding: 9px 16px;
        }
        .star-label { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600; }
        .stars { display: flex; gap: 3px; }
        .star {
            width: 20px; height: 20px; cursor: pointer;
            color: var(--text-dim); transition: color 0.15s, transform 0.15s;
        }
        .star:hover, .star.active { color: var(--warn); transform: scale(1.15); }
        .star svg { width: 100%; height: 100%; }

        /* Wishlist btn */
        .wishlist-btn {
            display: flex; align-items: center; gap: 7px;
            padding: 9px 18px;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 10px; color: var(--text-sub);
            font-family: 'Outfit', sans-serif; font-size: 0.83rem;
            cursor: pointer; transition: all 0.22s;
        }
        .wishlist-btn:hover {
            border-color: rgba(157,127,245,0.3);
            color: var(--purple1); background: var(--purple-soft);
        }
        .wishlist-btn svg { width: 16px; height: 16px; }

        /* ── DIVIDER ── */
        .section-divider {
            height: 1px; background: var(--glass-border); margin: 32px 0;
        }

        /* ── FULL DESCRIPTION ── */
        .desc-section { margin-bottom: 32px; }
        .section-title {
            font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            color: var(--text-dim); font-weight: 700; margin-bottom: 14px;
        }
        .desc-text {
            font-size: 0.9rem; color: var(--text-sub); line-height: 1.75;
            max-width: 720px;
        }
        .read-more {
            color: var(--purple1); font-size: 0.8rem; cursor: pointer;
            background: none; border: none; font-family: 'Outfit', sans-serif;
            margin-top: 8px; display: block; transition: opacity 0.2s;
        }
        .read-more:hover { opacity: 0.75; }

        /* ── RATINGS & REVIEWS BLOCK ── */
        .ratings-block {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 24px;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            margin-bottom: 32px;
        }
        .ratings-header {
            display: flex; align-items: center; justify-content: space-between;
        }
        .ratings-score-big {
            display: flex; align-items: baseline; gap: 6px;
        }
        .score-num {
            font-size: 3rem; font-weight: 700; line-height: 1;
            color: var(--text);
        }
        .score-denom { font-size: 1rem; color: var(--text-dim); }
        .score-label { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

        /* ── COMMENTS SECTION ── */
        .comments-section { }
        .comments-header {
            display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
        }
        .comment-count {
            font-size: 0.78rem; color: var(--text-dim);
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 3px 10px;
        }

        /* Comment input */
        .comment-input-wrap {
            display: flex; gap: 12px; align-items: flex-start; margin-bottom: 28px;
        }
        .comment-avatar {
            width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #4c1d95, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.7);
            border: 1px solid var(--glass-border);
        }
        .comment-input-box { flex: 1; }
        .comment-textarea {
            width: 100%; min-height: 80px;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--text);
            font-family: 'Outfit', sans-serif; font-size: 0.88rem;
            padding: 12px 16px; resize: vertical; outline: none;
            transition: all 0.25s;
        }
        .comment-textarea:focus {
            border-color: rgba(157,127,245,0.3);
            background: rgba(255,255,255,0.04);
        }
        .comment-textarea::placeholder { color: var(--text-dim); }
        .comment-actions {
            display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;
        }
        .btn-ghost {
            background: none; border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--text-sub);
            font-family: 'Outfit', sans-serif; font-size: 0.8rem;
            padding: 7px 16px; cursor: pointer; transition: all 0.2s;
        }
        .btn-ghost:hover { border-color: var(--border-h); color: var(--text); }
        .btn-primary {
            background: linear-gradient(135deg, var(--purple2), #5b21b6);
            border: none; border-radius: 8px; color: #fff;
            font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 600;
            padding: 7px 18px; cursor: pointer; transition: all 0.22s;
            box-shadow: 0 4px 16px var(--purple-glow);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(109,40,217,0.45); }

        /* Comment list */
        .comment-list { display: flex; flex-direction: column; gap: 1px; }

        .comment-item {
            padding: 18px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex; gap: 14px; align-items: flex-start;
        }
        .comment-item:last-child { border-bottom: none; }

        .c-avatar {
            width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700; color: rgba(255,255,255,0.65);
        }
        .c-body { flex: 1; }
        .c-meta {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
        }
        .c-meta-left {
            display: flex; align-items: center; gap: 8px;
        }
        .c-name { font-size: 0.83rem; font-weight: 600; color: var(--text); }
        .c-time { font-size: 0.72rem; color: var(--text-dim); }
        .c-text { font-size: 0.85rem; color: var(--text-sub); line-height: 1.6; }

        /* Three-dot menu */
        .c-menu-wrapper {
            position: relative;
        }
        .c-menu-btn {
            background: none; border: none; cursor: pointer;
            color: var(--text-dim); padding: 4px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .c-menu-btn:hover {
            background: var(--glass-h);
            color: var(--text-sub);
        }
        .c-menu-btn svg {
            width: 18px; height: 18px;
        }
        .c-menu-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 4px;
            background: var(--card);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 4px;
            min-width: 120px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
        }
        .c-menu-dropdown.show {
            display: block;
        }
        .c-menu-item {
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .c-menu-item:hover {
            background: var(--glass-h);
            color: var(--text);
        }
        .c-menu-item.danger {
            color: var(--danger);
        }
        .c-menu-item.danger:hover {
            background: rgba(248,113,113,0.1);
        }

        /* Edit mode */
        .c-edit-textarea {
            width: 100%;
            min-height: 60px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            padding: 10px 12px;
            resize: vertical;
            outline: none;
            margin-bottom: 8px;
        }
        .c-edit-textarea:focus {
            border-color: rgba(157,127,245,0.3);
            background: rgba(255,255,255,0.04);
        }
        .c-edit-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .c-edit-btn {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .c-edit-cancel {
            background: none;
            border: 1px solid var(--glass-border);
            color: var(--text-sub);
        }
        .c-edit-cancel:hover {
            border-color: var(--border-h);
            color: var(--text);
        }
        .c-edit-save {
            background: linear-gradient(135deg, var(--purple2), #5b21b6);
            border: none;
            color: #fff;
            font-weight: 600;
        }
        .c-edit-save:hover {
            transform: translateY(-1px);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .player-section { grid-template-columns: 1fr; }
            .info-panel { display: none; }
        }
        @media (max-width: 640px) {
            .movie-main-title { font-size: 1.25rem; }
            .action-row { gap: 8px; }
            .star-group { padding: 8px 12px; }
            .score-num { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="aurora">
    <div class="aurora-blob ab1"></div>
    <div class="aurora-blob ab2"></div>
    <div class="aurora-blob ab3"></div>
</div>
<div class="grid-overlay"></div>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="home.html" class="nav-logo"><span>Movie</span>Platform</a>
    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="home.html#movies" class="active">Movies</a>
        <a href="home.html#series">Series</a>
    </div>
    <div class="nav-right">
        <span class="greeting" id="nav-greeting" style="font-size:0.82rem;color:var(--text-sub);"></span>
        <button class="btn-sm btn-sm-danger" onclick="logout()">Sign out</button>
        <a href="profile.html" class="btn-sm profile-btn" title="Profile">
            <!-- User icon (outline) -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;color:var(--text-sub)">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
        </a>
    </div>
</nav>

<!-- MAIN -->
<div class="page-wrap">

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="home.html">Home</a>
        <span class="sep">/</span>
        <a href="home.html#movies">Movies</a>
        <span class="sep">/</span>
        <span class="current" id="bc-title">Loading…</span>
    </div>

    <!-- Player + Sidebar -->
    <div class="player-section">

        <!-- Player -->
        <div>
            <div class="player-box">
                <!-- Thumbnail / placeholder -->
                <div class="thumb-bg" id="thumb-bg"></div>
                <div class="player-placeholder" id="playerPlaceholder" onclick="startPlayer()">
                    <div class="play-ring">
                        <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
                    </div>
                    <span class="play-label">Click to Play</span>
                </div>
                <!-- VidSrc iframe injected here on play -->
                <iframe class="player-iframe" id="playerFrame" src="" allowfullscreen
                        allow="autoplay; fullscreen" style="display:none;"></iframe>
            </div>

            <!-- Source selector -->
            <div class="source-bar">
                <span class="source-label">Source</span>
                <button class="source-btn active" onclick="setSource(this,'vidsrc')">VidSrc</button>
                <button class="source-btn" onclick="setSource(this,'vidsrc2')">VidSrc 2</button>
                <button class="source-btn" onclick="setSource(this,'vidsrc3')">VidSrc 3</button>
            </div>
        </div>

        <!-- Info sidebar -->
        <div class="info-panel">
            <div class="glass-card">
                <!-- Poster -->
                <div id="sidebarPoster">
                    <div class="movie-poster-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M8 2v20M16 2v20M2 12h20M2 7h6M2 17h6M16 7h6M16 17h6"/></svg>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="panel-title" id="panel-title">Loading…</div>
                    <div class="ratings-row" id="panel-ratings"></div>
                    <div class="meta-list" id="panel-meta"></div>
                    <p class="panel-sub" id="panel-short-desc"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Below player: title, desc, actions -->
    <div class="below-player">
        <h1 class="movie-main-title" id="main-title">Loading…</h1>
        <p class="movie-short-desc" id="main-short-desc"></p>

        <!-- Action row -->
        <div class="action-row">

            <!-- Like / Dislike -->
            <div class="vote-group">
                <button class="vote-btn like" onclick="vote('like')" title="Like">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
                        <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
                    </svg>
                    <span id="like-count">0</span>
                </button>
                <div class="vote-divider"></div>
                <button class="vote-btn dislike" onclick="vote('dislike')" title="Dislike">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/>
                        <path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
                    </svg>
                    <span id="dislike-count">0</span>
                </button>
            </div>

            <!-- Star Rating -->
            <div class="star-group">
                <span class="star-label">Rate</span>
                <div class="stars" id="star-row">
                    <!-- JS renders stars -->
                </div>
            </div>

            <!-- Wishlist — connect wishlist endpoint here -->
            <button class="wishlist-btn" onclick="toggleWishlist()">
                <svg id="wishlist-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
                <span id="wishlist-label">Add to Watchlist</span>
            </button>

        </div>

        <!-- Full description -->
        <div class="desc-section">
            <p class="section-title">Synopsis</p>
            <p class="desc-text" id="full-desc"></p>
            <button class="read-more" id="read-more-btn" onclick="toggleDesc()">Show more</button>
        </div>

        <div class="section-divider"></div>

        <!-- Ratings & Reviews -->
        <div class="ratings-block">
            <div class="ratings-header">
                <div>
                    <p class="section-title" style="margin-bottom:8px;">User Rating</p>
                    <div class="ratings-score-big">
                        <span class="score-num" id="user-rating-score">—</span>
                        <span class="score-denom">/ 10</span>
                    </div>
                    <p class="score-label">Community Average</p>
                </div>
                <div style="text-align:right;">
                    <p class="section-title" style="margin-bottom:8px;">IMDb Rating</p>
                    <div class="ratings-score-big" style="justify-content:flex-end;">
                        <span class="score-num" style="font-size:2rem;" id="imdb-score">—</span>
                        <span class="score-denom">/ 10</span>
                    </div>
                    <p class="score-label">Official Score</p>
                </div>
            </div>
        </div>

        <div class="section-divider"></div>

        <!-- Comments -->
        <div class="comments-section">
            <div class="comments-header">
                <p class="section-title" style="margin:0;">Comments</p>
                <span class="comment-count" id="comment-count">3 comments</span>
            </div>

            <!-- Write comment -->
            <div class="comment-input-wrap">
                <div class="comment-avatar" id="user-avatar">?</div>
                <div class="comment-input-box">
                    <textarea class="comment-textarea" id="comment-input" placeholder="Share your thoughts…" rows="3"></textarea>
                    <div class="comment-actions">
                        <button class="btn-ghost" onclick="clearComment()">Cancel</button>
                        <button class="btn-primary" onclick="submitComment()">Post</button>
                    </div>
                </div>
            </div>

            <!-- Comment list -->
            <div class="comment-list" id="comment-list">
                <!-- seeded by JS -->
            </div>
        </div>

    </div><!-- /below-player -->
</div><!-- /page-wrap -->

<script>
    /* ── SESSION ── */
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
    if (!currentUser) {
        // Uncomment to enforce auth:
        // window.location.href = 'login.html';
    }
    document.getElementById('nav-greeting').textContent =
        currentUser ? `Hi, ${currentUser.name || 'User'}` : '';
    if (currentUser) {
        const initials = (currentUser.name || 'U').slice(0,2).toUpperCase();
        document.getElementById('user-avatar').textContent = initials;
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = 'login.html';
    }

    /* ── GET MOVIE ID FROM URL ── */
    const params = new URLSearchParams(location.search);
    const movieId = params.get('movieId') || 1;

    /* ── FETCH MOVIE ── */
    let movie = null;
    let playerSource = 'vidsrc';
    let playerStarted = false;

    async function loadMovie() {
        if (!currentUser) {
            alert('Please log in to view this movie.');
            window.location.href = 'login.html';
            return;
        }

        try {
            const securityRes = await fetch(`http://localhost:9090/rental/check?userId=${currentUser.id}&movieId=${movieId}`);
            const accessGranted = await securityRes.json();

            if (!accessGranted) {
                alert('You need an active rental pass to watch this movie.');
                window.location.href = `payment.html?movieId=${movieId}`;
                return;
            }

            const res = await fetch(`http://localhost:9090/movies/${movieId}`);
            if (!res.ok) throw new Error('Not found');
            movie = await res.json();
            renderMovie(movie);

            startPlayer();

        } catch (e) {
            console.error('System validation failure:', e);
        }
    }

    function renderMovie(m) {
        const title = m.name || 'Untitled';
        document.title = `${title} — MoviePlatform`;
        document.getElementById('bc-title').textContent = title;
        document.getElementById('main-title').textContent = title;
        document.getElementById('panel-title').textContent = title;

        const sd = m.shortdescription || '';
        document.getElementById('main-short-desc').textContent = sd;
        document.getElementById('panel-short-desc').textContent = sd;

        const fd = m.description || sd || 'No synopsis available.';
        const descEl = document.getElementById('full-desc');
        descEl._full = fd;
        descEl._collapsed = fd.length > 300;
        if (descEl._collapsed) {
            descEl.textContent = fd.slice(0,300) + '…';
            document.getElementById('read-more-btn').style.display = '';
        } else {
            descEl.textContent = fd;
            document.getElementById('read-more-btn').style.display = 'none';
        }

        if (m.image) {
            document.getElementById('sidebarPoster').innerHTML =
                `<img src="${m.image}" alt="${title}" class="movie-poster" onerror="this.parentElement.innerHTML='<div class=movie-poster-placeholder></div>'">`;
            document.getElementById('thumb-bg').style.backgroundImage = `url('${m.image}')`;
        }

        // Update IMDb score in the right side of ratings block
        document.getElementById('imdb-score').textContent = m.imdb != null ? m.imdb.toFixed(1) : '—';

        let pills = '';
        if (m.imdb != null) {
            pills += `<div class="rating-pill imdb-pill"><span>${m.imdb.toFixed(1)}</span><span class="label">Base Rating</span></div>`;
        }
        if (m.tomato != null) {
            pills += `<div class="rating-pill tomato-pill"><span>${Math.round(m.tomato)}%</span><span class="label">RT</span></div>`;
        }
        document.getElementById('panel-ratings').innerHTML = pills;

        const meta = [
            ['Language', m.language],
            ['Country', m.country],
            ['Category', m.category?.name],
            ['Price', m.price != null ? (m.price === 0 ? 'Free' : `$${m.price.toFixed(2)}`) : null],
        ];
        document.getElementById('panel-meta').innerHTML = meta
            .filter(([,v]) => v != null && v !== '')
            .map(([k,v]) => `<div class="meta-row"><span class="meta-key">${k}</span><span class="meta-val">${v}</span></div>`)
            .join('');
    }

    /* ── PLAYER SOURCE SWITCHER ── */
    function buildSrc(source) {
        const imdbString = movie?.link;
        if (!imdbString) return '';

        if (source === 'vidsrc') {
            return `https://vidsrcme.ru/embed/movie?imdb=${imdbString}`;
        }
        if (source === 'vidsrc2') {
            return `https://vidsrc.to/embed/movie/${imdbString}`;
        }
        if (source === 'vidsrc3') {
            return `https://vidsrc.xyz/embed/movie?imdb=${imdbString}`;
        }
        return '';
    }

    function startPlayer() {
        if (!movie?.link) {
            alert('No stream link configured for this movie.');
            return;
        }

        const placeholder = document.getElementById('playerPlaceholder');
        if (placeholder) {
            placeholder.style.setProperty('display', 'none', 'important');
        }

        const thumbBg = document.getElementById('thumb-bg');
        if (thumbBg) {
            thumbBg.style.setProperty('display', 'none', 'important');
        }

        const frame = document.getElementById('playerFrame');
        if (frame) {
            frame.src = buildSrc(playerSource);
            frame.style.setProperty('display', 'block', 'important');
            frame.style.pointerEvents = 'auto';
        }

        playerStarted = true;
    }

    function setSource(btn, src) {
        document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        playerSource = src;
        if (playerStarted) {
            document.getElementById('playerFrame').src = buildSrc(src);
        }
    }

    async function vote(type) {
        if (!currentUser) return alert("Please log in to vote.");

        try {
            const response = await fetch(`http://localhost:9090/rating/movie/${movieId}/vote`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.id,
                    type: type
                })
            });

            if (!response.ok) throw new Error("Vote registration failed");
            const data = await response.json();

            document.getElementById('like-count').textContent = data.likes;
            document.getElementById('dislike-count').textContent = data.dislikes;

            document.getElementById('like-btn')?.classList.toggle('active', data.userLikesState);
            document.getElementById('dislike-btn')?.classList.toggle('active', data.userDislikesState);

        } catch (err) {
            console.error("Voting system error:", err);
        }
    }

    async function loadLikesDislikes() {
        try {
            const userId = currentUser ? currentUser.id : '';
            const response = await fetch(`http://localhost:9090/rating/movie/${movieId}?userId=${userId}`);
            if (!response.ok) throw new Error("Failed to fetch vote data");

            const data = await response.json();

            const likeCountEl = document.getElementById('like-count');
            const dislikeCountEl = document.getElementById('dislike-count');
            if (likeCountEl) likeCountEl.textContent = data.likes != null ? data.likes : 0;
            if (dislikeCountEl) dislikeCountEl.textContent = data.dislikes != null ? data.dislikes : 0;

            document.getElementById('like-btn')?.classList.toggle('active', !!data.userLikesState);
            document.getElementById('dislike-btn')?.classList.toggle('active', !!data.userDislikesState);

        } catch (err) {
            console.error("Error syncing likes/dislikes on load:", err);
        }
    }

    /* ── STARS ── */
    let starRating = 0;
    let userHasRated = false;
    let communityAverage = 0;

    async function loadRatingStats() {
        try {
            const userId = currentUser ? currentUser.id : '';
            const statsRes = await fetch(`http://localhost:9090/rating/movie/${movieId}?userId=${userId}`);
            const stats = await statsRes.json();
            communityAverage = parseFloat(stats.averageRaw);

            if (currentUser) {
                const userRes = await fetch(`http://localhost:9090/rating/user/${currentUser.id}/movie/${movieId}`);
                const userData = await userRes.json();

                if (userData.hasRated) {
                    userHasRated = true;
                    starRating = userData.userRating;
                } else {
                    starRating = Math.round(communityAverage);
                }
            }

            renderStars();

            let displayAvg = stats.averageRating;
            if (parseFloat(displayAvg) <= 5.0 && parseFloat(displayAvg) > 0) {
                displayAvg = (parseFloat(displayAvg) * 2.0).toFixed(1);
            } else {
                displayAvg = stats.averageRating;
            }

            updateRatingDisplay({
                ...stats,
                averageRating: displayAvg
            });
        } catch (e) {
            console.error('Failed to load ratings:', e);
        }
    }

    function updateRatingDisplay(stats) {
        const scoreEl = document.getElementById('user-rating-score');
        if (scoreEl) {
            scoreEl.textContent = stats.averageRating;
        }
    }

    function renderStars() {
        const row = document.getElementById('star-row');
        row.innerHTML = '';

        for (let i = 1; i <= 5; i++) {
            const s = document.createElement('div');
            s.className = 'star' + (i <= starRating ? ' active' : '');
            s.innerHTML = `<svg viewBox="0 0 24 24" fill="${i<=starRating?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;

            s.addEventListener('click', async () => {
                if (!currentUser) {
                    alert('Please log in to rate this movie');
                    return;
                }

                starRating = i;
                renderStars();

                try {
                    const res = await fetch('http://localhost:9090/rating/rate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: currentUser.id,
                            movieId: movieId,
                            rating: i
                        })
                    });

                    const result = await res.json();
                    userHasRated = true;

                    updateRatingDisplay({
                        averageRating: result.newAverage,
                        totalRatings: result.totalRatings
                    });

                } catch (e) {
                    console.error('Failed to submit rating:', e);
                }
            });

            s.addEventListener('mouseenter', () => {
                if (!userHasRated) {
                    row.querySelectorAll('.star').forEach((st, idx) => {
                        st.style.color = idx < i ? 'var(--warn)' : 'var(--text-dim)';
                    });
                }
            });

            s.addEventListener('mouseleave', () => {
                row.querySelectorAll('.star').forEach((st, idx) => {
                    st.style.color = idx < starRating ? 'var(--warn)' : 'var(--text-dim)';
                });
            });

            row.appendChild(s);
        }
    }

    loadRatingStats();

    /* ── WISHLIST ── */
    let wishlisted = false;
    function toggleWishlist() {
        wishlisted = !wishlisted;
        const icon = document.getElementById('wishlist-icon');
        const label = document.getElementById('wishlist-label');
        if (wishlisted) {
            icon.setAttribute('fill', 'var(--purple1)');
            icon.setAttribute('stroke', 'var(--purple1)');
            label.textContent = 'In Watchlist';
        } else {
            icon.setAttribute('fill', 'none');
            icon.setAttribute('stroke', 'currentColor');
            label.textContent = 'Add to Watchlist';
        }
    }

    /* ── DESCRIPTION TOGGLE ── */
    function toggleDesc() {
        const el = document.getElementById('full-desc');
        const btn = document.getElementById('read-more-btn');
        if (el._collapsed) {
            el.textContent = el._full;
            el._collapsed = false;
            btn.textContent = 'Show less';
        } else {
            el.textContent = el._full.slice(0,300) + '…';
            el._collapsed = true;
            btn.textContent = 'Show more';
        }
    }

    /* ── COMMENTS ── */
    let comments = [];

    async function loadMovieComments() {
        try {
            const res = await fetch(`http://localhost:9090/api/comments/movie/${movieId}`);
            if (!res.ok) throw new Error("Could not download comment stream");
            comments = await res.json();
            renderComments();
        } catch (e) {
            console.error("Failed to sync comments section on load:", e);
        }
    }

    function renderComments() {
        const list = document.getElementById('comment-list');
        if (!list) return;

        document.getElementById('comment-count').textContent = `${comments.length} comment${comments.length !== 1 ? 's' : ''}`;

        if (comments.length === 0) {
            list.innerHTML = `<p style="color: #64748b; padding: 1rem 0;">No comments left yet. Be the first to share your thoughts!</p>`;
            return;
        }

        list.innerHTML = comments.map((c) => {
            const isOwner = currentUser && c.name === currentUser.name;

            return `
            <div class="comment-item" data-comment-id="${c.id}">
                <div class="c-avatar" style="background:${c.color};">${c.initials}</div>
                <div class="c-body">
                    <div class="c-meta">
                        <div class="c-meta-left">
                            <span class="c-name">${c.name}</span>
                            <span class="c-time">${c.time.includes('T') ? new Date(c.time).toLocaleDateString() : c.time}</span>
                        </div>
                        ${isOwner ? `
                        <div class="c-menu-wrapper">
                            <button class="c-menu-btn" onclick="toggleCommentMenu(${c.id}, event)">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <circle cx="12" cy="5" r="2"/>
                                    <circle cx="12" cy="12" r="2"/>
                                    <circle cx="12" cy="19" r="2"/>
                                </svg>
                            </button>
                            <div class="c-menu-dropdown" id="menu-${c.id}">
                                <button class="c-menu-item" onclick="editComment(${c.id})">Edit</button>
                                <button class="c-menu-item danger" onclick="deleteCommentFromDb(${c.id})">Delete</button>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                    <div class="c-text-wrapper">
                        <p class="c-text" id="text-${c.id}">${c.text}</p>
                    </div>
                </div>
            </div>
        `;
        }).join('');
    }

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.c-menu-wrapper')) {
            document.querySelectorAll('.c-menu-dropdown').forEach(menu => {
                menu.classList.remove('show');
            });
        }
    });

    function toggleCommentMenu(commentId, event) {
        event.stopPropagation();
        const menu = document.getElementById(`menu-${commentId}`);

        // Close all other menus
        document.querySelectorAll('.c-menu-dropdown').forEach(m => {
            if (m !== menu) m.classList.remove('show');
        });

        menu.classList.toggle('show');
    }

    function editComment(commentId) {
        // Close the menu
        document.getElementById(`menu-${commentId}`).classList.remove('show');

        const comment = comments.find(c => c.id === commentId);
        if (!comment) return;

        const textWrapper = document.querySelector(`[data-comment-id="${commentId}"] .c-text-wrapper`);

        textWrapper.innerHTML = `
            <textarea class="c-edit-textarea" id="edit-textarea-${commentId}">${comment.text}</textarea>
            <div class="c-edit-actions">
                <button class="c-edit-btn c-edit-cancel" onclick="cancelEdit(${commentId}, '${comment.text.replace(/'/g, "\\'")}')">Cancel</button>
                <button class="c-edit-btn c-edit-save" onclick="saveEdit(${commentId})">Save</button>
            </div>
        `;
    }

    function cancelEdit(commentId, originalText) {
        const textWrapper = document.querySelector(`[data-comment-id="${commentId}"] .c-text-wrapper`);
        textWrapper.innerHTML = `<p class="c-text" id="text-${commentId}">${originalText}</p>`;
    }

    async function saveEdit(commentId) {
        const textarea = document.getElementById(`edit-textarea-${commentId}`);
        const newText = textarea.value.trim();

        if (!newText) {
            alert('Comment cannot be empty');
            return;
        }

        try {
            const response = await fetch(`http://localhost:9090/api/comments/${commentId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.id,
                    body: newText
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || "Could not update comment");
            }

            // Reload comments to get fresh data
            await loadMovieComments();

        } catch (e) {
            console.error("Error updating comment:", e);
            alert(e.message || "Failed to update comment. Please try again.");
        }
    }

    function clearComment() {
        document.getElementById('comment-input').value = '';
    }

    async function submitComment() {
        const textInput = document.getElementById('comment-input');
        const text = textInput.value.trim();
        if (!text) return;

        if (!currentUser) {
            alert("Please log in to submit a comment.");
            return;
        }

        try {
            const response = await fetch('http://localhost:9090/api/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.id,
                    movieId: movieId,
                    body: text
                })
            });

            if (!response.ok) throw new Error("Could not process your comment entry.");

            textInput.value = '';
            await loadMovieComments();

        } catch (e) {
            console.error("Failed to post written comment:", e);
            alert("Could not post comment. Try again.");
        }
    }

    async function deleteCommentFromDb(commentId) {
        // Close the menu first
        document.getElementById(`menu-${commentId}`).classList.remove('show');

        if (!confirm("Are you sure you want to delete this comment permanently?")) return;
        if (!currentUser) return;

        try {
            const response = await fetch(`http://localhost:9090/api/comments/${commentId}?userId=${currentUser.id}`, {
                method: 'DELETE'
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || "Could not complete deletion request.");
            }

            await loadMovieComments();

        } catch (e) {
            console.error("Error clearing comment row selection:", e);
            alert(e.message || "Failed to delete comment. Please try again.");
        }
    }

    // ── INITIALIZATION LIFECYCLE FLOW ──
    loadMovie();
    loadLikesDislikes();
    loadRatingStats();
    loadMovieComments();
</script>
</body>
